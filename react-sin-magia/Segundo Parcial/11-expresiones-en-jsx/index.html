<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La Heladería</title>
</head>

<body>
    <div id="root"></div>

    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>
    <script type="text/babel" data-type="module">
        import React from "https://esm.sh/react@19.2.0?dev";
        import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

        const menuItem = {
            id: 1,
            iceCream: {
                id: 3,
                name: "Mora silvestre",
                imagePath: "images/mora.svg",
            },
            price: 1.5,
            description: "Mora de Ambato con un toque de limón.",
            inStock: true,
        };

        const formatPrice = (price) =>
            new Intl.NumberFormat("es-EC", {
                style: "currency",
                currency: "USD",
            }).format(price);

        const menu = (
            <>
                <main>
                    <h1>La Heladería</h1>
                    <article className="menu-item" aria-labelledby={`menu-item-${menuItem.id}-name`}>
                    <img src={menuItem.iceCream.imagePath} alt="" />
                    <h2 id={`menu-item-${menuItem.id}-name`}>{menuItem.iceCream.name}</h2>
                    <p className="menu-item-description">{menuItem.description}</p>
                    <p className="menu-item-price">{formatPrice(menuItem.price)}</p>
                    <p className="menu-item-stock">{menuItem.inStock ? "Disponible hoy" : "Agotado"}</p>
                </article>
            </main>
                <footer>
                    <p>La Heladería-- Ambato</p>
                </footer>
</>
);

        createRoot(document.getElementById("root")).render(menu);
    </script>

</body>

</html>
