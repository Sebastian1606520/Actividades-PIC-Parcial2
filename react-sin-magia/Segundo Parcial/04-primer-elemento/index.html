<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La Heladería</title>
</head>

<body>
    <div id="root"></div>

    <script type="module">
        import React from "https://esm.sh/react@19.2.0?dev";
        import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

        const title = React.createElement("h1", null, "La Heladería");
        console.log(title);

        const container = document.getElementById("root");
        createRoot(container).render(title);
    </script>

</body>

</html>
